[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vinhsphabmixay", email = "mistersvinh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary,pool]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.70.0",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.5.0",
]
